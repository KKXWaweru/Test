name: React CI/CD - Test and Publish to GHCR
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # This uses the exact GitHub repository path (e.g., 'your-username/quantam-app') in lowercase
  IMAGE_NAME: kkxwaweru/quantam-app

jobs:
  # Job 1: Run React Application Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26' # Specify your React app's required Node version
          cache: 'npm'       # Caches dependencies for faster subsequent runs

      - name: Install dependencies
        run: npm i

      # - name: Run tests
      #   # CI=true forces Jest/React-scripts to run in non-watch mode
      #   env:
      #     CI: true 
      #   run: npm test

  # Job 2: Build and Push Docker Image (Only if Job 1 passes)
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    # Required permissions to write packages to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PIPELINE_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/kkxwaweru/quantam-app
          # Automatically generates tags based on git events (e.g., 'latest' and the git SHA)
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

 